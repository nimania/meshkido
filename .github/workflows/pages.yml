name: Deploy MeshkiDo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: meshkido-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Telegram publisher behavior
        run: node --test tests/telegram-publish.test.mjs
      - name: Build verified static pages
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish new news and verified episode updates to MeshkiDo Telegram
        if: success()
        env:
          MESHKIDO_TELEGRAM_BOT_TOKEN: ${{ secrets.MESHKIDO_TELEGRAM_BOT_TOKEN }}
          MESHKIDO_TELEGRAM_CHAT: ${{ secrets.MESHKIDO_TELEGRAM_CHAT }}
        run: node scripts/telegram-publish.mjs
      - name: Persist Telegram delivery receipts
        if: success()
        run: |
          set -euo pipefail
          if [ ! -f data/telegram-posted.json ]; then exit 0; fi
          git add data/telegram-posted.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: persist MeshkiDo Telegram delivery receipts [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Telegram receipts persisted."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not persist Telegram delivery receipts."
          exit 1
