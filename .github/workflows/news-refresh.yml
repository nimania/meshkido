name: Refresh verified MeshkiDo news
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meshkido-news-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate news collector with offline tests
        run: python -m unittest discover -s tests -p 'test_news_collector.py' -v
      - name: Collect sourced series news
        run: python scripts/collect_news.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify updated website builds
        run: node scripts/build.mjs
      - name: Publish only validated news changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data/updates.json; then
            echo "No new verified news."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json
          git commit -m "data: refresh verified series news [skip ci]"
          # The pages workflow must still receive a push event; [skip ci] would suppress it.
          git commit --amend -m "data: refresh verified series news"
          git push origin HEAD:main
