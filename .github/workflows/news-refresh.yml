name: Refresh verified MeshkiDo news
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_news.py'
      - 'tests/test_news_collector.py'
      - 'tests/test_news_expansion.py'
      - 'scripts/news_expansion.py'
      - '.github/workflows/news-refresh.yml'
  schedule:
    # Official platforms hourly; specialized outlets every three hours.
    - cron: "17 * * * *"
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meshkido-news-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate news collector with offline tests
        run: python -m unittest discover -s tests -p 'test_news*.py' -v
      - name: Collect sourced series news
        env:
          MODE: ${{ github.event_name != 'schedule' && 'all' || github.event.schedule == '17 * * * *' && 'official' || 'editorial' }}
        run: |
          set -o pipefail
          python scripts/collect_news.py --mode "$MODE" | tee "$RUNNER_TEMP/meshkido-news-result.json"
          {
            echo '### MeshkiDo verified news sweep'
            echo '```json'
            cat "$RUNNER_TEMP/meshkido-news-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify updated website builds
        run: node scripts/build.mjs
      - name: Publish only validated news changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data/updates.json data/discovery-queue.json data/media-feed.json; then
            echo "No new verified news or new series candidates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json data/discovery-queue.json data/media-feed.json
          git commit -m "data: refresh verified series news and discovery queue"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not persist verified news; retry on next sweep."
          exit 1
